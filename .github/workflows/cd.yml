name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Check CI result
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI did not succeed."
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          exit 1

      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Show deployment information
        run: |
          echo "CD triggered by CI"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Runner: $RUNNER_NAME"
          echo "Host: $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "Workspace: $GITHUB_WORKSPACE"

      - name: Sync application files
        run: |
          rsync -av --delete \
            --exclude='.env' \
            "$GITHUB_WORKSPACE/" \
            "/home/freakipe/lab-manager/"

      - name: Verify production files
        run: |
          echo "Production directory:"
          ls -la /home/freakipe/lab-manager

          echo
          echo "Production environment file:"
          ls -l /home/freakipe/lab-manager/.env

          echo
          echo "Git commit deployed:"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
