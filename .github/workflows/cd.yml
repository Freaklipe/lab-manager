name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    # Solo desplegar si CI terminó correctamente Y fue ejecutado sobre main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: [self-hosted, Linux, ARM64]

    steps:

      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Show deployment information
        run: |
          echo "CD triggered by CI"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Runner: $RUNNER_NAME"
          echo "Host: $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "Workspace: $GITHUB_WORKSPACE"

      - name: Clean Git metadata from production
        run: |
          rm -rf /home/freakipe/lab-manager/.git
          rm -rf /home/freakipe/lab-manager/.github

      - name: Sync application files
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            "$GITHUB_WORKSPACE/" \
            "/home/freakipe/lab-manager/"

      - name: Verify production files
        run: |
          echo "Production directory:"
          ls -la /home/freakipe/lab-manager

          echo
          echo "Production environment file:"
          ls -l /home/freakipe/lab-manager/.env

          echo
          echo "Git metadata check:"
          if [ -d "/home/freakipe/lab-manager/.git" ]; then
            echo "ERROR: .git exists in production"
            exit 1
          else
            echo ".git not present"
          fi

          echo
          echo "GitHub workflow metadata check:"
          if [ -d "/home/freakipe/lab-manager/.github" ]; then
            echo "ERROR: .github exists in production"
            exit 1
          else
            echo ".github not present"
          fi

          echo
          echo "Git commit deployed:"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD

      - name: Deploy with Docker Compose
        working-directory: /home/freakipe/lab-manager
        run: |
          export BACKEND_VERSION="${{ github.event.workflow_run.head_sha }}"
          BACKEND_VERSION="${BACKEND_VERSION:0:7}"
          export APP_COMMIT="$BACKEND_VERSION"

          echo "Backend image tag: ${BACKEND_VERSION}"
          echo "Application commit: ${APP_COMMIT}"

          BACKEND_VERSION="$BACKEND_VERSION" APP_COMMIT="$APP_COMMIT" docker compose up -d --build

      - name: Show Docker Compose status
        working-directory: /home/freakipe/lab-manager
        run: |
          docker compose ps

      - name: Verify application health
        run: |
          echo "Checking application health..."

          for i in {1..12}; do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo
              echo "Application is healthy."
              exit 0
            fi

            echo "Application not ready yet. Attempt $i/12..."
            sleep 5
          done

          echo "ERROR: Application health check failed."
          exit 1
