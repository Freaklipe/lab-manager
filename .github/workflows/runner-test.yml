name: Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Linux, ARM64]

    steps:
      - name: Show runner information
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          hostname
          uname -a
          docker --version
          docker compose version
